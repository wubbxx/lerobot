<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">LeRobot Diffusion Policy 数据流与模型架构</title>
  <desc id="desc">从 LeRobotDataset 到 DiffusionPolicy 训练损失和推理动作输出的数据流图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px sans-serif; fill: #475569; }
      .section { font: 700 18px sans-serif; fill: #0f172a; }
      .label { font: 700 15px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #334155; }
      .tiny { font: 12px sans-serif; fill: #475569; }
      .mono { font: 13px monospace; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .dataset { fill: #ecfeff; stroke: #0891b2; }
      .pre { fill: #f0fdf4; stroke: #16a34a; }
      .model { fill: #eff6ff; stroke: #2563eb; }
      .train { fill: #fff7ed; stroke: #ea580c; }
      .infer { fill: #fdf2f8; stroke: #db2777; }
      .loss { fill: #fef2f2; stroke: #dc2626; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 2.4; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1180" />
  <text class="title" x="60" y="58">LeRobot Diffusion Policy 数据流与模型架构</text>
  <text class="subtitle" x="60" y="88">以 reach_yellow/0519 为例：单相机 480x640，4 维关节状态，4 维关节位置动作，n_obs_steps=2，horizon=16，n_action_steps=8</text>

  <!-- Dataset lane -->
  <text class="section" x="60" y="140">1. 数据集层：存储格式与时间窗口</text>
  <rect class="box dataset" x="60" y="160" width="260" height="150" />
  <text class="label" x="85" y="192">meta/info.json</text>
  <text class="small" x="85" y="220">robot_type: so_follower</text>
  <text class="small" x="85" y="245">fps: 30</text>
  <text class="small" x="85" y="270">features + shape + names</text>

  <rect class="box dataset" x="360" y="160" width="300" height="150" />
  <text class="label" x="385" y="192">data/*.parquet</text>
  <text class="small" x="385" y="220">observation.state: (4,)</text>
  <text class="small" x="385" y="245">action: (4,)</text>
  <text class="small" x="385" y="270">timestamp / episode_index / index</text>

  <rect class="box dataset" x="700" y="160" width="320" height="150" />
  <text class="label" x="725" y="192">videos/observation.images.front/*.mp4</text>
  <text class="small" x="725" y="220">raw frame: (480, 640, 3)</text>
  <text class="small" x="725" y="245">decode -> float32 [0, 1]</text>
  <text class="small" x="725" y="270">HWC -> CHW: (3, 480, 640)</text>

  <rect class="box dataset" x="1060" y="160" width="340" height="150" />
  <text class="label" x="1085" y="192">LeRobotDataset.__getitem__(idx)</text>
  <text class="small" x="1085" y="220">obs delta: [-1, 0]</text>
  <text class="small" x="1085" y="245">action delta: [-1, 0, ..., 14]</text>
  <text class="small" x="1085" y="270">生成 padding mask: action_is_pad</text>

  <rect class="box dataset" x="1440" y="160" width="300" height="150" />
  <text class="label" x="1465" y="192">单个训练样本</text>
  <text class="mono" x="1465" y="220">state:  (2, 4)</text>
  <text class="mono" x="1465" y="245">image:  (2, 3, 480, 640)</text>
  <text class="mono" x="1465" y="270">action: (16, 4)</text>

  <path class="arrow" d="M 320 235 L 360 235" />
  <path class="arrow" d="M 660 235 L 700 235" />
  <path class="arrow" d="M 1020 235 L 1060 235" />
  <path class="arrow" d="M 1400 235 L 1440 235" />

  <!-- Preprocess lane -->
  <text class="section" x="60" y="365">2. DataLoader 与预处理</text>
  <rect class="box pre" x="60" y="385" width="300" height="145" />
  <text class="label" x="85" y="417">DataLoader batch</text>
  <text class="mono" x="85" y="445">state:  (B, 2, 4)</text>
  <text class="mono" x="85" y="470">image:  (B, 2, 3, 480, 640)</text>
  <text class="mono" x="85" y="495">action: (B, 16, 4)</text>

  <rect class="box pre" x="405" y="385" width="300" height="145" />
  <text class="label" x="430" y="417">Preprocessor</text>
  <text class="small" x="430" y="445">Rename: 当前为空映射</text>
  <text class="small" x="430" y="470">Device: cuda/cpu</text>
  <text class="small" x="430" y="495">Normalize: visual mean/std</text>
  <text class="small" x="430" y="518">Normalize: state/action min-max</text>

  <rect class="box pre" x="750" y="385" width="350" height="145" />
  <text class="label" x="775" y="417">DiffusionPolicy.forward()</text>
  <text class="small" x="775" y="445">多相机 stack 到 observation.images</text>
  <text class="mono" x="775" y="470">image -> (B, 2, 1, 3, 480, 640)</text>
  <text class="mono" x="775" y="495">state -> (B, 2, 4)</text>
  <text class="mono" x="775" y="520">action -> (B, 16, 4)</text>

  <path class="arrow" d="M 1590 310 L 1590 340 L 210 340 L 210 385" />
  <path class="arrow" d="M 360 458 L 405 458" />
  <path class="arrow" d="M 705 458 L 750 458" />

  <!-- Model lane -->
  <text class="section" x="60" y="590">3. DiffusionModel：条件编码 + 1D 条件 U-Net</text>

  <rect class="box model" x="60" y="610" width="330" height="160" />
  <text class="label" x="85" y="642">_prepare_global_conditioning()</text>
  <text class="small" x="85" y="670">拆分 state 与 image</text>
  <text class="small" x="85" y="695">image flatten: (B*2*1, 3, 480, 640)</text>
  <text class="small" x="85" y="720">state: (B, 2, 4)</text>

  <rect class="box model" x="430" y="610" width="330" height="160" />
  <text class="label" x="455" y="642">DiffusionRgbEncoder</text>
  <text class="small" x="455" y="670">Resize/Crop: 当前无</text>
  <text class="small" x="455" y="695">ResNet18 conv map: 约 (512, 15, 20)</text>
  <text class="small" x="455" y="720">SpatialSoftmax: 32 keypoints x 2</text>
  <text class="mono" x="455" y="745">每帧视觉特征: 64-D</text>

  <rect class="box model" x="800" y="610" width="310" height="160" />
  <text class="label" x="825" y="642">全局条件向量</text>
  <text class="mono" x="825" y="672">image: (B, 2, 64)</text>
  <text class="mono" x="825" y="697">state: (B, 2, 4)</text>
  <text class="mono" x="825" y="722">concat: (B, 2, 68)</text>
  <text class="mono" x="825" y="747">flatten: (B, 136)</text>

  <rect class="box model" x="1150" y="610" width="260" height="160" />
  <text class="label" x="1175" y="642">动作扩散输入</text>
  <text class="small" x="1175" y="670">训练：加噪真实 action</text>
  <text class="small" x="1175" y="695">推理：高斯噪声初始化</text>
  <text class="mono" x="1175" y="725">x: (B, 16, 4)</text>
  <text class="mono" x="1175" y="750">t: (B,)</text>

  <rect class="box model" x="1450" y="610" width="290" height="160" />
  <text class="label" x="1475" y="642">DiffusionConditionalUnet1d</text>
  <text class="small" x="1475" y="670">x: (B,16,4) -> (B,4,16)</text>
  <text class="small" x="1475" y="695">t embed: (B,128)</text>
  <text class="small" x="1475" y="720">cond: concat(t, global)=264-D</text>
  <text class="small" x="1475" y="745">FiLM 条件残差块 + temporal U-Net</text>

  <path class="arrow-blue" d="M 925 530 L 925 565 L 225 565 L 225 610" />
  <path class="arrow-blue" d="M 390 690 L 430 690" />
  <path class="arrow-blue" d="M 760 690 L 800 690" />
  <path class="arrow-blue" d="M 1110 690 L 1150 690" />
  <path class="arrow-blue" d="M 1410 690 L 1450 690" />
  <path class="arrow-blue dash" d="M 955 770 L 955 815 L 1595 815 L 1595 770" />

  <!-- Training branch -->
  <text class="section" x="60" y="850">4A. 训练：预测噪声并计算 Loss</text>
  <rect class="box train" x="60" y="875" width="350" height="145" />
  <text class="label" x="85" y="907">Forward diffusion</text>
  <text class="small" x="85" y="935">trajectory = normalized action</text>
  <text class="mono" x="85" y="960">eps: (B, 16, 4)</text>
  <text class="mono" x="85" y="985">noisy_trajectory: (B, 16, 4)</text>

  <rect class="box loss" x="455" y="875" width="360" height="145" />
  <text class="label" x="480" y="907">Loss</text>
  <text class="small" x="480" y="935">prediction_type = epsilon</text>
  <text class="mono" x="480" y="960">pred:   (B, 16, 4)</text>
  <text class="mono" x="480" y="985">target: eps</text>
  <text class="small" x="480" y="1010">MSE mean；当前未 mask padding</text>

  <path class="arrow-red" d="M 1595 770 L 1595 835 L 235 835 L 235 875" />
  <path class="arrow-red" d="M 410 948 L 455 948" />

  <!-- Inference branch -->
  <text class="section" x="950" y="850">4B. 推理：反向扩散生成动作块</text>
  <rect class="box infer" x="950" y="875" width="330" height="145" />
  <text class="label" x="975" y="907">conditional_sample()</text>
  <text class="small" x="975" y="935">从高斯噪声开始</text>
  <text class="small" x="975" y="960">循环 num_inference_steps</text>
  <text class="mono" x="975" y="985">sample: (1, 16, 4)</text>

  <rect class="box infer" x="1320" y="875" width="420" height="145" />
  <text class="label" x="1345" y="907">select_action()</text>
  <text class="small" x="1345" y="935">取 current-time segment: actions[:, 1:9]</text>
  <text class="mono" x="1345" y="960">action chunk: (1, 8, 4)</text>
  <text class="small" x="1345" y="985">缓存 8 步，每次 pop 一个</text>
  <text class="mono" x="1345" y="1010">robot command: (1, 4)</text>

  <path class="arrow" d="M 1595 770 L 1595 840 L 1115 840 L 1115 875" />
  <path class="arrow" d="M 1280 948 L 1320 948" />

  <!-- Postprocess -->
  <rect class="box infer" x="1110" y="1060" width="470" height="80" />
  <text class="label" x="1135" y="1092">Postprocessor: UnnormalizerProcessorStep</text>
  <text class="small" x="1135" y="1120">把 [-1, 1] normalized action 还原为数据集/机械臂关节位置命令尺度</text>
  <path class="arrow" d="M 1530 1020 L 1530 1040 L 1345 1040 L 1345 1060" />

  <!-- Legend -->
  <rect class="box" x="60" y="1060" width="760" height="80" />
  <text class="label" x="85" y="1092">图例</text>
  <text class="small" x="150" y="1092">青色：数据集读取</text>
  <text class="small" x="310" y="1092">绿色：预处理</text>
  <text class="small" x="450" y="1092">蓝色：模型主体</text>
  <text class="small" x="590" y="1092">橙/红：训练与损失</text>
  <text class="small" x="150" y="1120">粉色：推理动作输出</text>
  <text class="small" x="310" y="1120">虚线：global_cond 条件注入到 U-Net FiLM 残差块</text>
</svg>
